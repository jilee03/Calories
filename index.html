<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>칼로리 기록</title>
<style>
  :root{
    --bg:#fff; --fg:#1a1a1a; --mute:#8a8a8a; --line:#e8e8e8;
    --soft:#f7f7f7; --accent:#1a1a1a; --warn:#c0392b;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; padding:48px 20px 80px;
  }
  .wrap{width:100%; max-width:460px}

  header{margin-bottom:32px}
  h1{font-size:17px; font-weight:600; letter-spacing:-.01em}
  .date{font-size:13px; color:var(--mute); margin-top:2px}

  /* 요약 */
  .summary{border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:28px}
  .kcal{display:flex; align-items:baseline; gap:6px}
  .kcal b{font-size:32px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .kcal span{font-size:13px; color:var(--mute)}
  .remain{font-size:13px; color:var(--mute); margin-top:2px}
  .remain.over{color:var(--warn)}

  .bar{height:4px; background:var(--soft); border-radius:2px; overflow:hidden; margin:14px 0 18px}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .25s}
  .bar i.over{background:var(--warn)}

  .macros{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
  .macro .lb{font-size:11px; color:var(--mute); letter-spacing:.02em}
  .macro .vl{font-size:13px; font-variant-numeric:tabular-nums; margin:3px 0 5px}
  .macro .mb{height:3px; background:var(--soft); border-radius:2px; overflow:hidden}
  .macro .mb i{display:block; height:100%; background:#c4c4c4; border-radius:2px; transition:width .25s}

  /* 입력 */
  .form{display:flex; gap:8px; margin-bottom:10px}
  .field{position:relative; flex:1}
  input,select,button{
    font:inherit; color:var(--fg); border:1px solid var(--line);
    background:var(--bg); border-radius:8px; height:42px; padding:0 12px; outline:none;
  }
  input{width:100%}
  input:focus,select:focus{border-color:#bdbdbd}
  input::placeholder{color:#bcbcbc}
  select{width:82px; cursor:pointer; -webkit-appearance:none; appearance:none;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23999' stroke-width='1.4'/></svg>") no-repeat right 11px center;
    padding-right:26px}
  .qty{width:64px; text-align:center}
  button.add{width:100%; height:42px; background:var(--accent); color:#fff; border:none; cursor:pointer; font-weight:500}
  button.add:hover{opacity:.86}
  button.add:disabled{background:#d5d5d5; cursor:default}

  /* 자동완성 */
  .sugg{position:absolute; top:46px; left:0; right:0; z-index:20;
    background:var(--bg); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.07); max-height:210px; overflow-y:auto; display:none}
  .sugg.on{display:block}
  .sugg div{padding:9px 12px; cursor:pointer; display:flex; justify-content:space-between; gap:10px}
  .sugg div:hover,.sugg div.sel{background:var(--soft)}
  .sugg .nm{font-size:14px}
  .sugg .kc{font-size:12px; color:var(--mute); white-space:nowrap}

  /* 목록 */
  .list{margin-top:32px}
  .list h2{font-size:12px; color:var(--mute); font-weight:500; letter-spacing:.03em; margin-bottom:6px}
  .row{display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line)}
  .row .meal{font-size:11px; color:var(--mute); width:26px; flex:none}
  .row .nm{flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .g{font-size:12px; color:var(--mute); flex:none}
  .row .kc{font-size:13px; font-variant-numeric:tabular-nums; flex:none; width:58px; text-align:right}
  .row .del{border:none; background:none; color:#cfcfcf; cursor:pointer; font-size:16px;
    height:auto; padding:0 0 0 4px; line-height:1}
  .row .del:hover{color:var(--warn)}
  .empty{padding:22px 0; color:#bcbcbc; font-size:13px; text-align:center; border-top:1px solid var(--line)}

  footer{margin-top:28px; display:flex; gap:8px}
  footer button{flex:1; height:38px; font-size:13px; color:var(--mute); cursor:pointer}
  footer button:hover{border-color:#bdbdbd; color:var(--fg)}
  .note{margin-top:16px; font-size:11px; color:#bcbcbc; line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>칼로리 기록</h1>
    <div class="date" id="today"></div>
  </header>

  <section class="summary">
    <div class="kcal"><b id="sumKcal">0</b><span>/ 1,980 kcal</span></div>
    <div class="remain" id="remain">1,980 kcal 남음</div>
    <div class="bar"><i id="barK" style="width:0"></i></div>
    <div class="macros">
      <div class="macro"><div class="lb">탄수화물</div><div class="vl" id="vC">0 / 248 g</div><div class="mb"><i id="bC" style="width:0"></i></div></div>
      <div class="macro"><div class="lb">단백질</div><div class="vl" id="vP">0 / 99 g</div><div class="mb"><i id="bP" style="width:0"></i></div></div>
      <div class="macro"><div class="lb">지방</div><div class="vl" id="vF">0 / 66 g</div><div class="mb"><i id="bF" style="width:0"></i></div></div>
    </div>
  </section>

  <div class="form">
    <select id="meal">
      <option>아침</option><option selected>점심</option><option>저녁</option><option>간식</option>
    </select>
    <div class="field">
      <input id="q" placeholder="음식 검색" autocomplete="off">
      <div class="sugg" id="sugg"></div>
    </div>
    <input class="qty" id="qty" value="1" inputmode="decimal">
  </div>
  <button class="add" id="add" disabled>추가</button>

  <div class="list">
    <h2>오늘 기록</h2>
    <div id="rows"><div class="empty">아직 기록이 없습니다</div></div>
  </div>

  <footer>
    <button id="csv">CSV 내려받기</button>
    <button id="clear">오늘 기록 지우기</button>
  </footer>

  <p class="note">
    표준 1인분 기준 추정치입니다. 조리유·양념·실제 분량에 따라 달라집니다.<br>
    내려받은 CSV를 <b>CalorieTracker</b> 폴더의 log 파일에 붙여넣으면 검수 스크립트로 확인할 수 있습니다.
  </p>

</div>

<script>
const TARGET = {kcal:1980, carb:248, protein:99, fat:66};

/* 표준 1인분 사전 — foods_standard.csv와 동일 */
const FOODS = [
["밥","1공기",210,300,66,5,1],["현미밥","1공기",210,310,64,6,3],["잡곡밥","1공기",210,305,64,7,2],
["김밥","1줄",230,470,72,13,12],["비빔밥","1대접",450,600,90,18,16],["볶음밥","1접시",350,600,85,15,20],
["김치볶음밥","1접시",350,620,84,16,23],["된장찌개","1대접",300,150,12,12,6],["김치찌개","1대접",300,240,10,16,14],
["순두부찌개","1대접",350,280,12,18,17],["미역국","1대접",300,90,6,7,4],["설렁탕","1대접",400,350,8,35,20],
["칼국수","1대접",600,550,90,20,10],["라면","1봉",120,500,73,10,17],["짜장면","1그릇",650,700,110,20,20],
["짬뽕","1그릇",700,660,95,28,18],["냉면","1그릇",600,550,100,18,7],["파스타(오일)","1접시",350,600,80,16,24],
["삼겹살","1인분",150,500,0,26,44],["목살","1인분",150,340,0,30,24],["소불고기","1인분",150,330,10,25,20],
["닭가슴살","1조각",100,110,0,23,2],["닭다리(구이)","1개",120,220,0,20,15],["치킨(후라이드)","1조각",80,250,10,15,17],
["계란(삶은)","1개",50,75,0,6,5],["계란후라이","1개",55,110,0,6,9],["두부","1/2모",150,120,3,13,7],
["고등어구이","1토막",100,220,0,20,15],["연어(구이)","1토막",100,200,0,22,12],["김치","1접시",40,10,2,1,0],
["시금치나물","1접시",60,40,3,3,2],["콩나물무침","1접시",60,35,3,3,2],["멸치볶음","1접시",20,60,4,6,2],
["어묵볶음","1접시",70,110,10,6,5],["샐러드(드레싱X)","1접시",150,40,7,2,0],["샐러드(드레싱O)","1접시",180,180,10,3,14],
["아메리카노","1잔",355,10,2,0,0],["카페라떼","1잔",355,180,15,10,9],["오렌지주스","1잔",250,110,26,1,0],
["맥주","1캔",500,200,16,2,0],["소주","1병",360,400,0,0,0],["사과","1개",200,105,28,1,0],
["바나나","1개",120,105,27,1,0],["아몬드","1줌",25,145,5,5,13],["식빵","1장",35,90,17,3,1],
["크루아상","1개",60,240,26,5,12]
].map(f=>({name:f[0],label:f[1],g:f[2],kcal:f[3],carb:f[4],protein:f[5],fat:f[6]}));

const TODAY = new Date().toLocaleDateString('sv-SE');
const KEY = 'ct-' + TODAY;

/* localStorage 사용 불가 환경 대비 */
let mem = [];
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return mem; } },
  set(v){ mem = v; try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} }
};

const $ = id => document.getElementById(id);
let items = store.get();
let picked = null, cursor = -1;

$('today').textContent = new Date().toLocaleDateString('ko-KR',
  {year:'numeric', month:'long', day:'numeric', weekday:'long'});

const n = v => Math.round(v).toLocaleString('ko-KR');

function render(){
  const t = items.reduce((a,i)=>({
    kcal:a.kcal+i.kcal, carb:a.carb+i.carb, protein:a.protein+i.protein, fat:a.fat+i.fat
  }), {kcal:0,carb:0,protein:0,fat:0});

  $('sumKcal').textContent = n(t.kcal);
  const diff = TARGET.kcal - t.kcal;
  const rm = $('remain');
  rm.textContent = diff >= 0 ? `${n(diff)} kcal 남음` : `${n(-diff)} kcal 초과`;
  rm.classList.toggle('over', diff < 0);

  const pk = t.kcal / TARGET.kcal * 100;
  $('barK').style.width = Math.min(pk,100) + '%';
  $('barK').classList.toggle('over', pk > 110);

  [['C','carb'],['P','protein'],['F','fat']].forEach(([k,m])=>{
    $('v'+k).textContent = `${n(t[m])} / ${TARGET[m]} g`;
    $('b'+k).style.width = Math.min(t[m]/TARGET[m]*100,100) + '%';
  });

  const box = $('rows');
  if(!items.length){ box.innerHTML = '<div class="empty">아직 기록이 없습니다</div>'; return; }
  box.innerHTML = items.map((i,x)=>`
    <div class="row">
      <span class="meal">${i.meal}</span>
      <span class="nm">${i.name}</span>
      <span class="g">${n(i.g)}g</span>
      <span class="kc">${n(i.kcal)}</span>
      <button class="del" data-x="${x}" title="삭제">×</button>
    </div>`).join('');
  box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    items.splice(+b.dataset.x,1); store.set(items); render();
  });
}

/* 자동완성 */
function showSugg(){
  const q = $('q').value.trim();
  const box = $('sugg');
  const hits = q ? FOODS.filter(f=>f.name.includes(q)).slice(0,8) : [];
  cursor = -1;
  if(!hits.length){ box.classList.remove('on'); return; }
  box.innerHTML = hits.map((f,i)=>
    `<div data-i="${i}"><span class="nm">${f.name}</span><span class="kc">${f.label} · ${f.kcal}kcal</span></div>`
  ).join('');
  box.classList.add('on');
  box.querySelectorAll('div[data-i]').forEach(d=>d.onclick=()=>pick(hits[+d.dataset.i]));
  box._hits = hits;
}

function pick(f){
  picked = f;
  $('q').value = f.name;
  $('sugg').classList.remove('on');
  $('add').disabled = false;
  $('qty').focus(); $('qty').select();
}

$('q').addEventListener('input', ()=>{ picked=null; $('add').disabled=true; showSugg(); });
$('q').addEventListener('keydown', e=>{
  const box = $('sugg'); if(!box.classList.contains('on')) return;
  const ds = box.querySelectorAll('div[data-i]');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    cursor += e.key==='ArrowDown' ? 1 : -1;
    if(cursor<0) cursor=ds.length-1; if(cursor>=ds.length) cursor=0;
    ds.forEach((d,i)=>d.classList.toggle('sel', i===cursor));
  } else if(e.key==='Enter' && cursor>=0){
    e.preventDefault(); pick(box._hits[cursor]);
  } else if(e.key==='Escape'){ box.classList.remove('on'); }
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.field')) $('sugg').classList.remove('on');
});

function addItem(){
  if(!picked) return;
  const q = parseFloat($('qty').value) || 1;
  items.push({
    meal: $('meal').value.slice(0,2),
    name: picked.name + (q!==1 ? ` x${q}` : ''),
    g: picked.g*q, kcal: picked.kcal*q,
    carb: picked.carb*q, protein: picked.protein*q, fat: picked.fat*q,
    label: picked.label, qty: q
  });
  store.set(items); render();
  picked=null; $('q').value=''; $('qty').value='1'; $('add').disabled=true; $('q').focus();
}
$('add').onclick = addItem;
$('qty').addEventListener('keydown', e=>{ if(e.key==='Enter') addItem(); });

$('csv').onclick = ()=>{
  if(!items.length) return;
  const head = 'date,meal,food,portion_label,portion_g,kcal,carb_g,protein_g,fat_g,confidence,note';
  const body = items.map(i=>[
    TODAY, i.meal, i.name, `${i.label}${i.qty!==1?` x${i.qty}`:''}`,
    Math.round(i.g), Math.round(i.kcal), Math.round(i.carb),
    Math.round(i.protein), Math.round(i.fat), '중', ''
  ].join(',')).join('\n');
  const url = URL.createObjectURL(new Blob(['﻿'+head+'\n'+body],{type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = `log_${TODAY}.csv`; a.click();
  URL.revokeObjectURL(url);
};

$('clear').onclick = ()=>{
  if(items.length && confirm('오늘 기록을 모두 지울까요?')){
    items = []; store.set(items); render();
  }
};

render();
</script>
</body>
</html>
